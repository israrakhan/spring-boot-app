name: Spring Boot build and deploy

on:
  push:
    branches:
      - main

env:
    IMAGE_NAME: israrkhan786/springboot-app:latest


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.SERVER_USER }}/${{ env.IMAGE_NAME }}:latest


      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.SERVER_USER }}/${{ env.IMAGE_NAME }}
            docker stop springboot-app || true
            docker rm springboot-app || true
            docker run -d --name springboot-app --restart unless-stopped -p 2330:2330 ${{ env.IMAGE_NAME }}
            docker image prune -f